<style>

.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b.d{color:#ef4444}

.dn .ck{background:#10b981;border-color:#10b981}.dn .ti b{text-decoration:line-through;opacity:.55}
.trow{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;padding:14px 16px}.ti{flex:1;min-width:0}.ti p{color:var(--mu);font-size:13px}

.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tb>*{width:auto;flex:1;min-width:120px;margin:0}

.cd:hover{border-color:var(--ac)}.cd.sel{background:var(--ac);color:#fff}.cd.td{border-color:var(--ac);border-width:2px}.cd.e{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:9px;background:var(--ac)}.dots i.g{background:#10b981}.dots i.o{background:#f59e0b}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px}.bar{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}.col{flex:1;display:flex;align-items:flex-end}
.col b{width:100%;background:linear-gradient(var(--ac),#a78bfa);border-radius:6px 6px 0 0;min-height:2px;transform-origin:bottom;animation:gr .7s}
@keyframes gr{from{transform:scaleY(0)}}.bar small{font-size:10px;text-align:center;color:var(--mu);height:14px;overflow:hidden}
.donut{width:150px;height:150px;border-radius:50%;flex:none;-webkit-mask:radial-gradient(circle 46px,transparent 98%,#000);mask:radial-gradient(circle 46px,transparent 98%,#000)}
.ach{text-align:center;transition:.3s}.ach .ic{font-size:40px}.ach.lk{opacity:.5;filter:grayscale(1)}.ach.fr{animation:pop .9s;border-color:var(--ac)}

#ov{position:relative;z-index:100}.scrim{position:fixed;inset:0;background:rgba(10,12,30,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s;overflow:auto}
.mod{background:var(--cd);border-radius:24px;padding:24px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop2 .35s}
@keyframes pop2{from{transform:scale(.9);opacity:0}}
.cel{text-align:center}.cel .big{font-size:60px;animation:pop .9s}
.cf span{position:fixed;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#zen{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center}
#zen.on{display:flex}#ztm{font-size:min(24vw,150px)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;animation:fi .3s;box-shadow:var(--sh)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx)}
.err{color:#ef4444;font-size:13px;min-height:18px}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.line:last-child{border:0}
.empty{text-align:center;color:var(--mu);padding:30px}textarea.mono{font:12px monospace;height:180px}
@media(max-width:820px){#app{display:block}nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--bd);z-index:20;justify-content:space-around;gap:0}
nav .logo,nav .sp,nav .tt{display:none}nav button{flex-direction:column;gap:0;font-size:10px;padding:6px 2px;flex:1;align-items:center;text-align:center}main{padding:16px 14px 96px}h1{font-size:22px}#tm{font-size:44px}#toast{bottom:100px}}
body{background:radial-gradient(900px 500px at 92% -8%,color-mix(in srgb,var(--ac) 20%,transparent),transparent),radial-gradient(700px 420px at -8% 108%,#a78bfa26,transparent),var(--bg);background-attachment:fixed}
.card{backdrop-filter:blur(8px)}.card:hover{transform:translateY(-2px);box-shadow:0 12px 32px color-mix(in srgb,var(--ac) 14%,transparent)}
.ringw .card:hover,.mod:hover{transform:none}
.b.p{background:linear-gradient(135deg,var(--ac),#a78bfa);border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}
nav{background:color-mix(in srgb,var(--cd) 88%,transparent);backdrop-filter:blur(12px)}
nav button.on{box-shadow:inset 3px 0 0 var(--ac)}
#rg{filter:drop-shadow(0 0 8px var(--ac))}
.st b{background:linear-gradient(135deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
#login{position:fixed;inset:0;z-index:300;display:none;overflow:auto;background:var(--bg);padding:16px}#login.on{display:flex}
.lg{margin:auto;display:grid;grid-template-columns:1fr 1fr;width:min(900px,100%);border-radius:28px;overflow:hidden;background:var(--cd);box-shadow:0 30px 80px rgba(20,20,60,.28);animation:pop2 .5s}
.lb{padding:36px;color:#fff;background:linear-gradient(145deg,var(--ac),#7c3aed 60%,#ec4899);position:relative}
.lb ul{list-style:none;padding:0;margin-top:22px;display:grid;gap:10px;font-weight:600}.lb li{background:#ffffff22;padding:10px 14px;border-radius:12px}
.lf{padding:36px}.pw{position:relative}.eye{position:absolute;right:6px;top:8px;border:0;background:none;cursor:pointer;font-size:18px}
.hint{margin-top:18px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--ac) 10%,transparent);font-size:13px;line-height:1.9}.hint code{background:var(--bg);padding:2px 8px;border-radius:8px;font-weight:700}.hint .b{padding:6px 12px;margin-top:6px}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:820px){.lg{grid-template-columns:1fr}.lb{padding:24px}.lb ul{display:none}.lf{padding:24px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="login"></div><div id="zen"></div><div id="ov"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LSK='focusbox.v1',C=2*Math.PI*110;
const MODES={pomodoro:['Pomodoro',25],deep:['Deep Focus',50],sprint:['Sprint',15],study:['Study',45],custom:['Custom',30]};
const CATS=['Study','Work','Personal','Other'],PRI=['Low','Medium','High'];
const CC={Study:'#6366f1',Work:'#0ea5e9',Personal:'#f59e0b',Other:'#94a3b8'},PC={Low:'#10b981',Medium:'#f59e0b',High:'#ef4444'};
const LV=[['Beginner',0],['Getting Started',100],['Focused',300],['Consistent',700],['Deep Worker',1500],['Focus Master',3000]];
const ACC=['#6366f1','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6'];
const NAV=[['dash','Dashboard','🏠'],['focus','Focus','⏱'],['tasks','Tasks','✅'],['cal','Calendar','📅'],['ana','Analytics','📊'],['ach','Achievements','🏆'],['set','Settings','⚙️']];
const def=()=>({tasks:[],sessions:[],xp:0,ach:{},bonus:{},set:{theme:'system',ac:'#6366f1',goal:120,mode:'pomodoro',brk:5,auto:false,h24:false,custom:30}});
function load(){try{const j=JSON.parse(localStorage.getItem(LSK));if(j&&Array.isArray(j.tasks)){const d=def();return Object.assign(d,j,{set:Object.assign(d.set,j.set||{})})}}catch(e){}return def()}
function save(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
let S=load(),V='dash',F={q:'',st:'all',cat:'all',pri:'all',sort:'due'},R=7,FR=new Set(),PEND=null;
let cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:K()};
let T={mode:'pomodoro',total:0,rem:0,run:false,end:0,brk:false,n:1,task:'',st:0};
/* helpers */
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hm=m=>m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';
const ft=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:!S.set.h24});
const fd=k=>new Date(k+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const o=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');
const minsOn=k=>S.sessions.filter(s=>s.date===k).reduce((a,s)=>a+s.mins,0);
const rng=n=>{const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(K(d))}return a};
const doneK=t=>t.doneAt?K(new Date(t.doneAt)):'';
const lvl=xp=>{let i=0;LV.forEach((l,j)=>{if(xp>=l[1])i=j});return i};
const dn=k=>{const p=k.split('-');return Date.UTC(p[0],p[1]-1,p[2])/864e5};
function streak(){const set=new Set(S.sessions.map(s=>s.date));const d=new Date();if(!set.has(K(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(K(d))){n++;d.setDate(d.getDate()-1)}return n}
function best(){const a=[...new Set(S.sessions.map(s=>dn(s.date)))].sort((x,y)=>x-y);let b=0,c=0;a.forEach((x,i)=>{c=i&&x-a[i-1]===1?c+1:1;b=Math.max(b,c)});return b}
function st(){const ss=S.sessions;return{ses:ss.length,mins:ss.reduce((a,s)=>a+s.mins,0),tasks:S.tasks.filter(t=>t.done).length,best:best(),max:Math.max(0,...ss.map(s=>s.mins)),night:ss.some(s=>s.h>=22||s.h<4),early:ss.some(s=>s.h>=4&&s.h<7)}}
const ACH=[['first','First Focus','🎯','Complete your first session',s=>s.ses>=1],['s7','7-Day Streak','🔥','Focus 7 days in a row',s=>s.best>=7],['h10','10 Hours Focused','⏳','Reach 10 hours of focus',s=>s.mins>=600],['t50','50 Tasks','✅','Complete 50 tasks',s=>s.tasks>=50],['deep','Deep Worker','🧠','Finish a session of 50+ minutes',s=>s.max>=50],['night','Night Owl','🦉','Focus between 10pm and 4am',s=>s.night],['early','Early Starter','🌅','Focus between 4am and 7am',s=>s.early],['s100','100 Sessions','💯','Complete 100 sessions',s=>s.ses>=100]];
function chk(){const s=st(),n=[];ACH.forEach(a=>{if(!S.ach[a[0]]&&a[4](s)){S.ach[a[0]]=Date.now();FR.add(a[0]);n.push(a)}});return n}
function toast(m){const e=document.createElement('div');e.className='tst';e.textContent=m;$('#toast').appendChild(e);setTimeout(()=>e.remove(),3200)}
function openM(h,c){$('#ov').innerHTML=`<div class="scrim"><div class="mod ${c||''}">${h}</div></div>`}
function closeM(){$('#ov').innerHTML=''}
function ask(msg,fn){PEND=fn;openM(`<h2>Are you sure?</h2><p class=sub>${msg}</p><div class=acts><button class=b data-a=close>Cancel</button><button class="b p" data-a=yes>Confirm</button></div>`)}
function theme(){const r=document.documentElement;S.set.theme=='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.set.theme);r.style.setProperty('--ac',S.set.ac)}
/* timer */
function setMode(m){if(T.run)return;T.mode=m;T.brk=false;T.total=T.rem=(m=='custom'?S.set.custom:MODES[m][1])*60000;T.st=0}
function enterBrk(){T.run=false;T.brk=true;T.total=T.rem=S.set.brk*60000}
function startT(){if(T.run)return;if(!T.rem)T.rem=T.total;T.run=true;T.end=Date.now()+T.rem;if(!T.st&&!T.brk)T.st=Date.now();updT()}
function pauseT(){if(!T.run)return;T.rem=Math.max(0,T.end-Date.now());T.run=false;updT()}
function tick(){if(!T.run)return;T.rem=T.end-Date.now();if(T.rem<=0){T.rem=0;finish()}updT()}
function setT(s,v){const e=$(s);if(e&&e.textContent!==v)e.textContent=v}
function updT(){const t=mmss(T.rem);const r=$('#rg');if(r)r.style.strokeDashoffset=C*(T.total?T.rem/T.total:1);
setT('#tm',t);setT('#ztm',t);setT('#bt',T.run?'⏸ Pause':T.rem<T.total?'▶ Resume':'▶ Start');setT('#zbt',T.run?'⏸ Pause':'▶ Start');
const s=$('#st');if(s){s.textContent=T.brk?'Break':'Focus';s.className='pill '+(T.brk?'brk':'')}document.title=T.run?t+' · FocusBox':'FocusBox — Turn time into progress'}
function finish(){T.run=false;if(T.brk){T.brk=false;setMode(T.mode);toast('Break over — ready to focus');render();return}
const now=new Date(),mins=Math.max(1,Math.round(T.total/60000)),had=S.sessions.some(x=>x.date===K(now));
const task=S.tasks.find(t=>t.id===T.task);
S.sessions.push({id:uid(),date:K(now),ts:now.getTime(),mins,mode:T.mode,task:T.task,cat:task?task.cat:'Other',h:new Date(T.st||now).getHours()});
let g=mins+10,ex=[];if(!had){const b=5*Math.min(streak(),10);if(b)ex.push(`+${b} streak bonus`);g+=b}
if(minsOn(K(now))>=S.set.goal&&!S.bonus[K(now)]){S.bonus[K(now)]=1;g+=50;ex.push('+50 daily goal reached')}
S.xp+=g;const na=chk();save();T.n++;T.st=0;enterBrk();if(S.set.auto)startT();
const zen=$('#zen').classList.contains('on');
openM(`<div class=cel><div class=big>🎉</div><h2>Session complete!</h2><p class=sub>${mins} minutes focused · <b>+${g} XP</b>${ex.length?'<br>'+ex.join(' · '):''}</p>${na.map(a=>`<p><b>${a[2]} ${a[1]}</b> unlocked!</p>`).join('')}<p class=sub>${S.set.auto?'Your break has started.':'Take a short break?'} (${S.set.brk} min)</p><div class=acts style="justify-content:center"><button class="b p" data-a=${S.set.auto?'close':'brk'}>${S.set.auto?'Continue':'Start break'}</button><button class=b data-a=nobrk>Skip break</button></div></div>`,'cel');
const cf=document.createElement('div');cf.className='cf';for(let i=0;i<40;i++){const p=document.createElement('span');p.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},80%,60%);animation-delay:${Math.random()*.8}s`;cf.appendChild(p)}$('#ov').appendChild(cf);setTimeout(()=>cf.remove(),4000);
if(zen)zenClose();render()}
/* actions */
const A={
go:i=>{V=i;render();scrollTo(0,0)},
mode:i=>{if(T.run)return toast('Pause the timer to change mode');setMode(i);render()},
tog:()=>{T.run?pauseT():startT()},
reset:()=>{T.run=false;T.rem=T.total;T.st=0;updT()},
skip:()=>{T.run=false;if(T.brk){T.brk=false;setMode(T.mode)}else enterBrk();render();toast(T.brk?'Skipped to break':'Back to focus')},
zen:()=>{$('#zen').innerHTML=`<div class=logo><i></i>FocusBox</div><p class=sub id=zt></p><div id=ztm></div><div class=acts style="justify-content:center"><button class="b p" id=zbt data-a=tog></button><button class=b data-a=zexit>✕ Exit</button></div>`;const t=S.tasks.find(x=>x.id===T.task);$('#zt').textContent=t?t.title:(T.brk?'Break time':'Stay focused');$('#zen').classList.add('on');try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();p&&p.catch(()=>{})}catch(e){}updT()},
zexit:()=>zenClose(),
tnew:()=>tform(),tedit:i=>tform(i),

function vAch(){const un=ACH.filter(a=>S.ach[a[0]]).length;return `<h1>Achievements</h1><p class=sub>${un} of ${ACH.length} unlocked</p><div class="grid g4">${ACH.map(a=>{const u=S.ach[a[0]];return `<div class="card ach ${u?(FR.has(a[0])?'fr':''):'lk'}"><div class=ic>${u?a[2]:'🔒'}</div><b>${a[1]}</b><p class=sub style="margin:4px 0 0;font-size:13px">${a[3]}</p>${u?`<small style="color:#10b981;font-weight:700">Unlocked ${fd(K(new Date(u)))}</small>`:''}</div>`}).join('')}</div>`}
function vSet(){const s=S.set,tg=(k,l)=>`<div class=line><span>${l}</span><button class="chip ${s[k]?'on':''}" data-a=tgl data-i=${k}>${s[k]?'On':'Off'}</button></div>`;
return `<h1>Settings</h1><p class=sub>Make FocusBox yours.</p><div class="grid g2"><div class=card><h2>Appearance</h2><div class=line><span>Theme</span><span class=chips style="margin:0">${['light','dark','system'].map(t=>`<button class="chip ${s.theme==t?'on':''}" data-a=theme data-i=${t}>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</span></div><div class=line><span>Accent color</span><div class=sw>${ACC.map(c=>`<button class="${s.ac==c?'on':''}" style="background:${c}" data-a=accent data-i="${c}" aria-label="${c}"></button>`).join('')}</div></div>${tg('h24','24-hour time')}</div>
<div class=card><h2>Focus</h2><label>Daily focus goal (minutes)<input type=number data-s=goal min=10 max=720 value="${s.goal}"></label><label>Default timer<select data-s=mode>${Object.keys(MODES).map(k=>`<option value=${k} ${s.mode==k?'selected':''}>${MODES[k][0]}</option>`).join('')}</select></label><label>Default break (minutes)<input type=number data-s=brk min=1 max=60 value="${s.brk}"></label>${tg('auto','Start breaks automatically')}</div></div>
<div class=card><h2>Your data</h2><p class=sub>Everything is stored locally in your browser.</p><div class=acts style="justify-content:flex-start"><button class=b data-a=exp>⬇ Export data</button><button class=b data-a=imp>⬆ Import data</button><button class="b d" data-a=rst>Reset data</button></div></div>
<div class=card><h2>Account</h2><p class=sub>Signed in as <b>${esc(curUser())}</b>. Change your login below (stored only in this browser).</p><div class=row><label>New username<input id=nu value="${esc(curUser())}" autocomplete=off></label><label>New password<input id=np type=password autocomplete=new-password placeholder="6+ characters"></label></div><p class=err id=cerr></p><div class=acts style="justify-content:flex-start"><button class="b p" data-a=cred>Update login</button><button class=b data-a=out>⎋ Log out</button></div></div>`}
function render(){const v={dash:vDash,focus:vFocus,tasks:vTasks,cal:vCal,ana:vAna,ach:vAch,set:vSet}[V];
$('#nav').innerHTML=`<div class=logo><i></i>FocusBox</div>`+NAV.map(n=>`<button class="${V==n[0]?'on':''}" data-a=go data-i=${n[0]}><span>${n[2]}</span>${n[1]}</button>`).join('')+`<div class=sp></div><div class=tt><button data-a=out style="width:100%">⎋ Log out</button><small style="color:var(--mu);padding:6px 12px;display:block">Turn time into progress.</small></div>`;
const m=$('#main');m.style.animation='none';m.offsetHeight;m.style.animation='';m.innerHTML=v();updT()}
theme();setMode(S.set.mode);render();if(!isIn())showLogin();setInterval(tick,250);setInterval(()=>{const c=$('#clk');if(c)c.textContent=ft(Date.now())},20000);
</script></body></html>
